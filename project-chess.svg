<svg width="440" height="250" viewBox="0 0 440 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="440" height="250" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="4" height="250" rx="2" fill="#39d98a"/>
  <rect x="1" y="1" width="438" height="248" rx="9" fill="none" stroke="#39d98a" stroke-opacity="0.25"/>

  <foreignObject x="0" y="0" width="440" height="250">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;box-sizing:border-box;font-family:'JetBrains Mono','Fira Code',monospace;padding:22px 24px 18px 28px;color:#e6edf3;display:flex;flex-direction:column;justify-content:space-between;">
      <div>
        <div style="font-size:11px;color:#6b8f7a;letter-spacing:2px;margin-bottom:9px;">PROJECT / 03</div>
        <div style="font-size:19px;font-weight:700;color:#39d98a;margin-bottom:9px;">Chess Engine Server</div>
        <div style="font-size:12.5px;line-height:1.55;color:#a9b7ae;">Multiplayer chess backend in Go, built on the notnil/chess move-validation engine with Postgres-backed state, Docker, and an Nginx reverse proxy.</div>
      </div>
      <div>
        <div style="display:flex;flex-wrap:wrap;margin-top:10px;"><div style="display:inline-block;border:1px solid rgba(57,217,138,0.45);color:#8ee6b3;font-size:11px;padding:4px 10px;border-radius:20px;margin:0 6px 6px 0;">Go</div><div style="display:inline-block;border:1px solid rgba(57,217,138,0.45);color:#8ee6b3;font-size:11px;padding:4px 10px;border-radius:20px;margin:0 6px 6px 0;">PostgreSQL</div><div style="display:inline-block;border:1px solid rgba(57,217,138,0.45);color:#8ee6b3;font-size:11px;padding:4px 10px;border-radius:20px;margin:0 6px 6px 0;">Docker</div><div style="display:inline-block;border:1px solid rgba(57,217,138,0.45);color:#8ee6b3;font-size:11px;padding:4px 10px;border-radius:20px;margin:0 6px 6px 0;">Nginx</div></div>
        <div style="text-align:right;color:#39d98a;font-size:13px;margin-top:6px;">view repo &#8594;</div>
